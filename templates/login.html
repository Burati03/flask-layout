{% extends "layout.html" %}

{% block main %}

<h1>Login</h1>

<form method="POST">

    <label>Usuário:</label>
    <input type="text" name="usuario" required>

    <br><br>

    <label>Senha:</label>
    <input type="password" name="senha" required>

    <br><br>

    <button type="submit">Entrar</button>

</form>

{% if erro %}
    <p>{{ erro }}</p>
{% endif %}

{% endblock %}
